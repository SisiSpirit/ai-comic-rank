name: Daily AI Comic Rank

on:
  schedule:
    # - cron: '0 1 * * *'  # UTC时间1点，即北京时间早上9点
    - cron: '0 0 * * *'    # UTC时间0点，即北京时间早上8点
  workflow_dispatch: # 允许手动触发测试

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 给予仓库写入权限，以便保存抓取的数据
    permissions:
      contents: write
   
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run crawler
        run: |
          python crawler.py
          
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-update rank data $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
